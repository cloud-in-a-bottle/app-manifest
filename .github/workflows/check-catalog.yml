name: Catalog

# Contributors only edit apps/<name>/app.toml (works entirely from the GitHub
# web UI). CI runs generate.py so the generated catalog.json never has to be
# produced by hand:
#   - On a PR from a branch in this repo, the regenerated catalog.json is
#     committed back onto the PR branch.
#   - On a PR from a fork (where Actions cannot push to the fork branch), the
#     job only validates; catalog.json is reconciled on merge by the main job.
#   - On push to main, catalog.json is regenerated and committed if stale,
#     which is what catches the fork case.
# In every case generate.py also validates the TOML and fails the job on
# invalid input (bad name, unknown category, malformed score).
#
# On a PR, only the repos whose app.toml changed are checked for being public,
# so verification scales with the size of the diff, not the catalog. A full
# scan of every repo is available on demand via the workflow_dispatch "scan"
# job (authenticated by GITHUB_TOKEN to clear the unauthenticated rate limit).

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      apps:
        description: "Apps to scan, space-separated (blank = whole catalog)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  pr:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    concurrency:
      group: catalog-pr-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Regenerate catalog.json (validates the TOML)
        run: python3 generate.py
      - name: Verify changed repos are public
        run: |
          base="${{ github.event.pull_request.base.ref }}"
          git remote add upstream "https://github.com/${{ github.repository }}.git" 2>/dev/null || true
          git fetch --quiet upstream "$base"
          names=$(git diff --name-only "upstream/$base...HEAD" -- 'apps/*/app.toml' | cut -d/ -f2 | sort -u)
          if [ -z "$names" ]; then
            echo "no app.toml changes; nothing to verify"
            exit 0
          fi
          echo "verifying changed apps: $names"
          python3 generate.py --verify-repos $names
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit catalog.json to the PR branch
        if: github.event.pull_request.head.repo.full_name == github.repository
        run: |
          if git diff --quiet -- catalog.json; then
            echo "catalog.json already up to date"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog.json
          git commit -m "Regenerate catalog.json"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
      - name: Fork PR notice
        if: github.event.pull_request.head.repo.full_name != github.repository
        run: |
          if ! git diff --quiet -- catalog.json; then
            echo "::notice::catalog.json is stale; it will be regenerated on this repo's main branch when the PR is merged."
          fi

  reconcile:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    concurrency:
      group: catalog-reconcile-main
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Regenerate catalog.json (validates the TOML)
        run: python3 generate.py
      - name: Commit catalog.json to main
        run: |
          if git diff --quiet -- catalog.json; then
            echo "catalog.json already up to date"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog.json
          git commit -m "Regenerate catalog.json [skip ci]"
          git pull --rebase origin main
          git push

  scan:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Scan catalog repos are public with a manifest
        run: python3 generate.py --verify-repos $APPS
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPS: ${{ inputs.apps }}
