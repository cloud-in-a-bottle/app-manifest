[app]
name = "tangled"
title = "Tangled Knot"
description = "Self-hosted Tangled knot: the git data server for Tangled (tangled.org), the AT-Protocol-based social coding platform. Host your own repositories and federate with the Tangled network — your identity is your ATProto/Bluesky DID, the AppView provides the web UI and issues/PRs as ATProto records, and your knot holds the actual git data. Clone over HTTPS, push over SSH."
repo_url = "https://github.com/imbue-openhost/bottled-tangled"
packaging_license = "MIT"
website_url = "https://tangled.org"
docs_url = "https://github.com/imbue-openhost/bottled-tangled#readme"
tags = ["git", "atproto", "federation", "forge", "bluesky"]
categories = ["development"]
