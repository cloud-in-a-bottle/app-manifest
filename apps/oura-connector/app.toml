[app]
name = "oura-connector"
title = "Oura Connector"
description = "Imports, stores, and displays personal health data from Oura smart rings — including sleep, activity, and readiness metrics — and exposes the collected data through an API for other apps."
repo_url = "https://github.com/imbue-openhost/oura-connector"
website_url = "https://github.com/imbue-openhost/oura-connector"
docs_url = "https://github.com/imbue-openhost/oura-connector#readme"
tags = ["oura", "fitness", "data"]
categories = ["utility", "data-liberation"]

openhost_integration_score = 4
openhost_integration_score_explanation = "Zone owner is auto-recognized and reaches the dashboard and data with zero clicks (no app login); non-owners are bounced to the zone login. Perimeter-based rather than a full owner session."