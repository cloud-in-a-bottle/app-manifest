[app]
name = "unciv"
title = "Unciv Multiplayer Server"
description = "Self-hosted multiplayer server for Unciv, the open-source Civ V remake. Host the game-save backend so you and your friends can play online multiplayer from your Unciv desktop/Android clients instead of the flaky shared public server. Point your client's Server address at this app's URL."
repo_url = "https://github.com/imbue-openhost/openhost-unciv"
website_url = "https://github.com/yairm210/Unciv"
docs_url = "https://github.com/imbue-openhost/openhost-unciv#readme"
tags = ["unciv", "civ", "strategy", "games", "multiplayer"]
categories = ["entertainment"]

openhost_integration_score = 3
openhost_integration_score_explanation = "Owner gets a zero-click, SSO-gated landing page with the server URL to paste into their Unciv client; the game-save API is public (game clients can't do browser SSO) and saves persist. It's a headless game backend, so there's no in-app owner session."
